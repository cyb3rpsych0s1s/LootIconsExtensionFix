[package]
name = "loot_icons_extension_fix"
authors = ["Roms1383", "Demon9ne"]
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[dependencies]
red4ext-rs = { git = "https://github.com/jac3km4/red4ext-rs", tag = "v0.11.1", features = ["log"] }
red4ext-rs-bindings = { git = "https://github.com/Roms1383/red4ext-rs-bindings", rev = "2a6bd565fc371f4aabf299b8162de651a1617a8f" }
